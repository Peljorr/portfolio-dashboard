<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>ML Portfolio Optimization &amp; Risk Forecasting &ndash; Project Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root{
  --bg:#F5F6FA;
  --surface:#FFFFFF;
  --surface2:#F0F2F7;
  --border:#E1E4EB;
  --text:#151E2B;
  --muted:#647085;
  --gold:#E8A200;
  --gold-dark:#B87E00;
  --teal:#1D8FA6;
  --coral:#E1584C;
  --sage:#3E9A66;
  --violet:#7A6FCC;
  --sand:#C77B2E;
  --shadow:0 1px 2px rgba(21,30,43,0.04), 0 4px 14px rgba(21,30,43,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(180deg,#F8F9FC 0%,#F3F5F9 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{
  font-family:Cambria,Georgia,"Times New Roman",serif;
  font-weight:600;
  letter-spacing:0.1px;
}
.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:258px;flex:0 0 258px;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:30px 20px;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
}
.brand{margin-bottom:32px;}
.brand-mark{
  width:38px;height:38px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--sand) 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:Cambria,Georgia,serif;color:#fff;font-size:19px;font-weight:700;
  margin-bottom:15px;box-shadow:0 3px 10px rgba(232,162,0,0.35);
}
.brand-title{font-size:14.5px;line-height:1.4;color:var(--text);font-weight:700;}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:3px;}

nav{display:flex;flex-direction:column;gap:3px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 11px;border-radius:9px;
  cursor:pointer;border:1px solid transparent;
  transition:background 0.15s ease, transform 0.1s ease;
}
.nav-item:hover{background:var(--surface2);}
.nav-item:active{transform:scale(0.98);}
.nav-item.active{background:linear-gradient(135deg,#FFF6E2,#FFF0D0);border-color:#F2DFA3;box-shadow:0 1px 4px rgba(232,162,0,0.12);}
.nav-icon{width:16px;height:16px;flex:0 0 16px;color:#B7BFCC;transition:color 0.15s ease;}
.nav-item.active .nav-icon{color:var(--gold-dark);}
.nav-icon svg{width:100%;height:100%;}
.nav-num{
  font-family:Cambria,Georgia,serif;
  font-size:12.5px;color:var(--muted);flex:0 0 16px;
}
.nav-item.active .nav-num{color:var(--gold-dark);}
.nav-label{font-size:13.5px;color:var(--text);font-weight:500;}
.nav-item.active .nav-label{color:var(--gold-dark);font-weight:700;}

.sidebar-foot{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--border);
  font-size:11px;color:var(--muted);line-height:1.6;
}
.hint{
  margin-top:18px;padding:12px 13px;border-radius:10px;
  background:#F0F6FF;border:1px solid #D8E7FA;
  font-size:11.3px;color:#3B5A7A;line-height:1.55;
}
.hint b{color:#1D5A8A;}

.present-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:16px;padding:11px 14px;border-radius:8px;
  background:var(--text);color:#fff;border:none;font-size:13px;font-weight:600;
  cursor:pointer;transition:background 0.15s ease;
}
.present-btn:hover{background:#2A3646;}
.present-btn svg{width:15px;height:15px;flex:0 0 15px;}
.exit-hint{font-size:10.8px;color:var(--muted);text-align:center;margin-top:8px;}

:fullscreen .sidebar{padding-top:20px;}
:fullscreen body{background:var(--bg);}
:-webkit-full-screen .sidebar{padding-top:20px;}

/* ---------- Main ---------- */
main{flex:1;padding:44px 56px 100px;max-width:960px;}
.section{display:block;padding-top:8px;scroll-margin-top:14px;}
.section + .section{margin-top:8px;padding-top:44px;border-top:1px solid var(--border);}
.section h1{font-size:24px;color:var(--text);margin:0 0 7px;letter-spacing:-0.3px;}
.section#section-overview h1{font-size:30px;}
.section .dek{font-size:14px;color:var(--muted);max-width:640px;line-height:1.6;margin-bottom:24px;}

/* ---------- Floating presenter nav ---------- */
.presenter-nav{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:30px;padding:9px 14px;
  box-shadow:0 6px 24px rgba(21,30,43,0.14), 0 1px 3px rgba(21,30,43,0.06);
  z-index:50;
}
.pnav-btn{
  width:34px;height:34px;border-radius:50%;border:none;background:var(--surface2);
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all 0.15s ease;flex:0 0 34px;
}
.pnav-btn:hover:not(:disabled){background:var(--gold);color:#fff;transform:scale(1.06);}
.pnav-btn:disabled{opacity:0.3;cursor:default;}
.pnav-btn svg{width:16px;height:16px;}
.pnav-dots{display:flex;align-items:center;gap:7px;padding:0 4px;}
.pnav-dot{width:7px;height:7px;border-radius:50%;background:#D5D9E0;cursor:pointer;transition:all 0.2s ease;border:none;padding:0;}
.pnav-dot:hover{background:#B7BFCC;}
.pnav-dot.active{background:var(--gold);width:20px;border-radius:4px;}
.pnav-label{font-size:11.5px;color:var(--muted);padding:0 2px;white-space:nowrap;min-width:118px;}
.pnav-kbd{font-size:10px;color:#AEB6C2;border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-left:2px;font-family:-apple-system,sans-serif;}

.eyebrow{font-size:12.5px;color:var(--muted);margin-bottom:10px;letter-spacing:0.2px;}

.crumb-bar{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:9px;
  background:rgba(245,246,250,0.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  margin:0 -56px 18px;padding:12px 56px;
  border-bottom:1px solid var(--border);
  font-size:12px;color:var(--muted);font-weight:600;
}
.crumb-bar .crumb-icon{width:14px;height:14px;color:var(--gold-dark);flex:0 0 14px;}
.crumb-bar .crumb-icon svg{width:100%;height:100%;}
.crumb-bar b{color:var(--text);}

.hero-stat{
  border:1px solid #F0DFA5;background:linear-gradient(135deg,#FFFCF5 0%,#FFF6E2 55%,#FFF0D5 100%);
  padding:32px 34px;border-radius:16px;margin-bottom:34px;
  display:flex;align-items:center;gap:30px;flex-wrap:wrap;
  box-shadow:0 4px 20px rgba(232,162,0,0.1), 0 1px 3px rgba(21,30,43,0.04);
  position:relative;overflow:hidden;
  animation:heroIn 0.55s cubic-bezier(.2,.8,.2,1);
}
.hero-stat::before{
  content:"";position:absolute;top:-40%;right:-8%;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.55),rgba(255,255,255,0));pointer-events:none;
}
.hero-num{font-family:Cambria,Georgia,serif;font-size:58px;color:var(--gold-dark);line-height:1;font-weight:700;letter-spacing:-1px;}
.hero-text{font-size:14.5px;color:var(--text);max-width:400px;line-height:1.6;}
.hero-text b{color:var(--gold-dark);font-weight:700;}
.hero-spark{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:auto;}
.hero-spark-label{font-size:10.5px;color:var(--muted);text-align:center;max-width:130px;line-height:1.4;}
@keyframes heroIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.card{
  border:1px solid var(--border);background:var(--surface);
  border-radius:14px;padding:23px 25px;margin-bottom:24px;
  box-shadow:0 1px 2px rgba(21,30,43,0.03), 0 6px 18px rgba(21,30,43,0.045);
  transition:box-shadow 0.2s ease, transform 0.2s ease;
}
.card:hover{box-shadow:0 4px 8px rgba(21,30,43,0.05), 0 12px 28px rgba(21,30,43,0.07);transform:translateY(-1px);}
.card h3{font-size:15.5px;color:var(--text);margin:0 0 4px;font-weight:700;}
.card .card-note{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.55;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start;}
@media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.stat-box{border:1px solid var(--border);border-radius:12px;padding:17px 19px;background:var(--surface2);transition:transform 0.15s ease, box-shadow 0.15s ease;}
.stat-box:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(21,30,43,0.06);}
.stat-box .label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.stat-box .value{font-family:Cambria,Georgia,serif;font-size:24px;color:var(--text);font-weight:700;}
.stat-box.win .value{color:var(--gold-dark);}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{
  text-align:right;color:var(--muted);font-weight:600;
  padding:8px 10px;border-bottom:1.5px solid var(--border);font-size:11.8px;
}
th:first-child,td:first-child{text-align:left;}
td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);text-align:right;}
tr:last-child td{border-bottom:none;}
tr.highlight td{color:var(--gold-dark);font-weight:700;}
tr.best td{background:#FFFAEE;}
tr.hover-row:hover td{background:var(--surface2);cursor:pointer;}
.tag{
  display:inline-block;font-size:10.8px;padding:2px 7px;border-radius:4px;
  border:1px solid var(--border);color:var(--muted);
}

/* ---------- Legend (clickable) ---------- */
.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;}
.legend-item{
  display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text);font-weight:500;
  padding:6px 12px 6px 9px;border-radius:20px;border:1px solid var(--border);
  cursor:pointer;user-select:none;transition:all 0.15s ease;background:var(--surface);
}
.legend-item:hover{background:var(--surface2);border-color:#C7CCD6;transform:translateY(-1px);box-shadow:0 2px 6px rgba(21,30,43,0.06);}
.legend-item.off{opacity:0.38;}
.legend-item.off .legend-swatch{background:#C7CCD6 !important;}
.legend-swatch{width:9px;height:9px;border-radius:3px;flex:0 0 9px;}

/* ---------- Toggle buttons ---------- */
.toggle-group{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 2px rgba(21,30,43,0.03);}
.toggle-btn{
  padding:8px 17px;font-size:12.5px;color:var(--muted);background:var(--surface);font-weight:500;
  cursor:pointer;border:none;border-right:1px solid var(--border);transition:all 0.15s ease;
}
.toggle-btn:last-child{border-right:none;}
.toggle-btn:hover{background:var(--surface2);}
.toggle-btn.active{background:linear-gradient(135deg,var(--gold),#D89400);color:#fff;font-weight:700;}

/* ---------- Tooltip ---------- */
.chart-wrap{position:relative;}
.chart-tooltip{
  position:absolute;pointer-events:none;background:#182233;color:#fff;
  border-radius:8px;padding:9px 12px;font-size:11.8px;line-height:1.6;
  box-shadow:0 8px 24px rgba(21,30,43,0.25);opacity:0;transition:opacity 0.1s ease;
  z-index:20;white-space:nowrap;
}
.chart-tooltip.show{opacity:1;}
.chart-tooltip .tt-title{font-weight:700;margin-bottom:3px;color:#F0C766;}
.chart-tooltip .tt-row{display:flex;align-items:center;gap:6px;}
.chart-tooltip .tt-dot{width:8px;height:8px;border-radius:2px;display:inline-block;}

.footnote{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px;}
.divider{border:none;border-top:1px solid var(--border);margin:34px 0;}

.tooltip-svg-label{font-size:10.5px;fill:var(--muted);font-family:-apple-system,sans-serif;}
.hover-target{cursor:pointer;}

</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">&sigma;</div>
        <div class="brand-title">ML Portfolio Optimization &amp; Risk Forecasting</div>
        <div class="brand-sub">BIA405 Mini-Project &middot; GCBS</div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        Six companies &middot; 2020&ndash;2024<br/>
        Weekly frequency &middot; 250 obs/ticker<br/>
        All figures from the project's own pipeline output.
      </div>
      <button class="present-btn" id="present-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span id="present-btn-label">Present full screen</span>
      </button>
      <div class="exit-hint">Press Esc to exit</div>
    </aside>
    <main id="main"></main>
    <div class="presenter-nav" id="presenter-nav">
      <button class="pnav-btn" id="pnav-prev" title="Previous (Left arrow)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="pnav-dots" id="pnav-dots"></div>
      <span class="pnav-label" id="pnav-label"></span>
      <button class="pnav-btn" id="pnav-next" title="Next (Right arrow)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <span class="pnav-kbd">&larr; &rarr;</span>
    </div>
  </div>

<script>
// ============== Core infra ==============
let CHART_SEQ = 0;
let PENDING_INITS = [];
function afterRender(fn) { PENDING_INITS.push(fn); }
function runPendingInits() { const fns = PENDING_INITS; PENDING_INITS = []; fns.forEach((fn) => { try { fn(); } catch (e) { console.error("chart init error:", e); } }); }
function nextId(prefix) { return prefix + "-" + CHART_SEQ++; }

function scale(value, domainMin, domainMax, rangeMin, rangeMax) {
  if (domainMax === domainMin) return (rangeMin + rangeMax) / 2;
  return rangeMin + ((value - domainMin) / (domainMax - domainMin)) * (rangeMax - rangeMin);
}
function niceTicks(min, max, count) {
  const ticks = [];
  for (let i = 0; i <= count; i++) ticks.push(min + ((max - min) * i) / count);
  return ticks;
}
function tooltipRow(color, label, value) {
  return `<div class="tt-row"><span class="tt-dot" style="background:${color}"></span>${label}: <b style="margin-left:2px">${value}</b></div>`;
}

// ============== Interactive multi-line chart ==============
function lineChart(opts) {
  const { width = 760, height = 320, series, xLabels, yFormat = (v) => v.toFixed(2), showLegend = true, areaFor = null } = opts;
  const id = nextId("lc");
  const margin = { top: 16, right: 20, bottom: 34, left: 56 };
  const w = width - margin.left - margin.right;
  const h = height - margin.top - margin.bottom;

  const allVals = series.flatMap((s) => s.values);
  let yMin = Math.min(...allVals), yMax = Math.max(...allVals);
  const pad = (yMax - yMin) * 0.08 || Math.abs(yMax) * 0.1 || 1;
  yMin -= pad; yMax += pad;

  const n = series[0].values.length;
  const x = (i) => margin.left + scale(i, 0, n - 1, 0, w);
  const y = (v) => margin.top + scale(v, yMax, yMin, 0, h);

  const yTicks = niceTicks(yMin, yMax, 4);
  const gridLines = yTicks.map((t) =>
    `<line x1="${margin.left}" x2="${margin.left + w}" y1="${y(t)}" y2="${y(t)}" stroke="#E8EAEF" stroke-width="1"/>` +
    `<text x="${margin.left - 8}" y="${y(t) + 4}" text-anchor="end" class="tooltip-svg-label">${yFormat(t)}</text>`
  ).join("");

  const xTickIdx = [];
  const step = Math.max(1, Math.floor(n / (xLabels ? Math.min(xLabels.length, 6) : 6)));
  for (let i = 0; i < n; i += step) xTickIdx.push(i);
  if (n - 1 - xTickIdx[xTickIdx.length - 1] < step / 2) xTickIdx.pop();
  xTickIdx.push(n - 1);
  const xTicksSvg = xLabels ? xTickIdx.map((i, idx) => {
    const anchor = idx === xTickIdx.length - 1 ? "end" : idx === 0 ? "start" : "middle";
    return `<text x="${x(i)}" y="${margin.top + h + 20}" text-anchor="${anchor}" class="tooltip-svg-label">${xLabels[i]}</text>`;
  }).join("") : "";

  const areaSeries = areaFor ? series.find((s) => s.name === areaFor) : null;
  const areaDef = areaSeries ? `<linearGradient id="${id}-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${areaSeries.color}" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="${areaSeries.color}" stop-opacity="0"/>
    </linearGradient>` : "";
  const areaPath = areaSeries ? (() => {
    const line = areaSeries.values.map((v, i) => `${i === 0 ? "M" : "L"} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
    return `<path d="${line} L ${x(n - 1).toFixed(1)} ${margin.top + h} L ${x(0).toFixed(1)} ${margin.top + h} Z" fill="url(#${id}-area)"/>`;
  })() : "";

  const paths = series.map((s, si) =>
    `<path id="${id}-path-${si}" d="${s.values.map((v, i) => `${i === 0 ? "M" : "L"} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`
  ).join("");

  const dots = series.map((s, si) =>
    `<circle id="${id}-dot-${si}" cx="0" cy="0" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="1.6" style="display:none"/>`
  ).join("");

  const zeroLine = yMin < 0 && yMax > 0 ? `<line x1="${margin.left}" x2="${margin.left + w}" y1="${y(0)}" y2="${y(0)}" stroke="#C7CCD6" stroke-width="1" stroke-dasharray="3,3"/>` : "";

  const legend = showLegend ? `<div class="legend" id="${id}-legend">${series.map((s, si) =>
    `<div class="legend-item" id="${id}-legend-${si}"><span class="legend-swatch" style="background:${s.color}"></span>${s.name}</div>`
  ).join("")}</div>` : "";

  const html = `<div class="chart-wrap" id="${id}-wrap">
    <svg id="${id}-svg" viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      <defs>${areaDef}</defs>
      ${gridLines}${zeroLine}
      <line x1="${margin.left}" x2="${margin.left + w}" y1="${margin.top + h}" y2="${margin.top + h}" stroke="#D5D9E0" stroke-width="1"/>
      ${areaPath}
      ${paths}
      <line id="${id}-cursor" x1="0" x2="0" y1="${margin.top}" y2="${margin.top + h}" stroke="#9AA3B2" stroke-width="1" stroke-dasharray="3,3" style="opacity:0"/>
      ${dots}
      ${xTicksSvg}
      <rect id="${id}-overlay" x="${margin.left}" y="${margin.top}" width="${w}" height="${h}" fill="transparent" style="cursor:crosshair"/>
    </svg>
    <div class="chart-tooltip" id="${id}-tooltip"></div>
  </div>${legend}`;

  afterRender(() => {
    const svg = document.getElementById(id + "-svg");
    const overlay = document.getElementById(id + "-overlay");
    const cursor = document.getElementById(id + "-cursor");
    const tooltip = document.getElementById(id + "-tooltip");
    const visible = series.map(() => true);

    series.forEach((s, si) => {
      const legendItem = document.getElementById(id + "-legend-" + si);
      if (legendItem) {
        legendItem.addEventListener("click", () => {
          visible[si] = !visible[si];
          legendItem.classList.toggle("off", !visible[si]);
          const path = document.getElementById(id + "-path-" + si);
          if (path) path.style.display = visible[si] ? "" : "none";
        });
      }
    });

    if (overlay) {
      overlay.addEventListener("mousemove", (e) => {
        const rect = svg.getBoundingClientRect();
        const scaleX = width / rect.width;
        const pxX = e.clientX - rect.left;
        const vbX = pxX * scaleX;
        let idx = Math.round(scale(vbX, margin.left, margin.left + w, 0, n - 1));
        idx = Math.max(0, Math.min(n - 1, idx));
        const cx = x(idx);
        cursor.setAttribute("x1", cx); cursor.setAttribute("x2", cx);
        cursor.style.opacity = 1;

        let rows = "";
        series.forEach((s, si) => {
          const dot = document.getElementById(id + "-dot-" + si);
          if (!visible[si]) { if (dot) dot.style.display = "none"; return; }
          const val = s.values[idx];
          if (dot) { dot.setAttribute("cx", x(idx)); dot.setAttribute("cy", y(val)); dot.style.display = ""; }
          rows += tooltipRow(s.color, s.name, yFormat(val));
        });
        tooltip.innerHTML = `<div class="tt-title">${xLabels ? xLabels[idx] : idx}</div>${rows}`;
        tooltip.classList.add("show");
        let left = pxX + 14;
        if (left > rect.width - 170) left = pxX - 175;
        tooltip.style.left = left + "px";
        tooltip.style.top = Math.max(0, (e.clientY - rect.top) - 44) + "px";
      });
      overlay.addEventListener("mouseleave", () => {
        cursor.style.opacity = 0;
        series.forEach((s, si) => { const dot = document.getElementById(id + "-dot-" + si); if (dot) dot.style.display = "none"; });
        tooltip.classList.remove("show");
      });
    }
  });

  return html;
}

// ============== Interactive grouped bar chart ==============
function barChart(opts) {
  const { width = 760, height = 320, categories, series, yFormat = (v) => v.toFixed(2), showLegend = true, negativeOk = false } = opts;
  const id = nextId("bc");
  const margin = { top: 16, right: 20, bottom: 34, left: 56 };
  const w = width - margin.left - margin.right;
  const h = height - margin.top - margin.bottom;

  const allVals = series.flatMap((s) => s.values);
  let yMin = negativeOk ? Math.min(0, ...allVals) : 0;
  let yMax = Math.max(...allVals) * 1.18;

  const y = (v) => margin.top + scale(v, yMax, yMin, 0, h);
  const yTicks = niceTicks(yMin, yMax, 4);
  const gridLines = yTicks.map((t) =>
    `<line x1="${margin.left}" x2="${margin.left + w}" y1="${y(t)}" y2="${y(t)}" stroke="#E8EAEF" stroke-width="1"/>` +
    `<text x="${margin.left - 8}" y="${y(t) + 4}" text-anchor="end" class="tooltip-svg-label">${yFormat(t)}</text>`
  ).join("");

  const catW = w / categories.length;
  const groupPad = catW * 0.16;
  const barW = (catW - groupPad * 2) / series.length;

  const gradDefs = series.map((s, si) =>
    `<linearGradient id="${id}-grad-${si}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${s.color}" stop-opacity="1"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0.78"/>
    </linearGradient>`
  ).join("");

  let bars = "";
  series.forEach((s, si) => {
    bars += `<g id="${id}-series-${si}">`;
    categories.forEach((cat, ci) => {
      const v = s.values[ci];
      const bx = margin.left + ci * catW + groupPad + si * barW;
      const by = Math.min(y(0), y(v));
      const bh = Math.max(Math.abs(y(v) - y(0)), 1);
      bars += `<rect id="${id}-bar-${si}-${ci}" class="hover-target" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(barW - 2).toFixed(1)}" height="${bh.toFixed(1)}" fill="url(#${id}-grad-${si})" rx="3"/>`;
    });
    bars += `</g>`;
  });
  const catLabels = categories.map((cat, ci) =>
    `<text x="${(margin.left + ci * catW + catW / 2).toFixed(1)}" y="${margin.top + h + 20}" text-anchor="middle" class="tooltip-svg-label">${cat}</text>`
  ).join("");

  const legend = showLegend ? `<div class="legend" id="${id}-legend">${series.map((s, si) =>
    `<div class="legend-item" id="${id}-legend-${si}"><span class="legend-swatch" style="background:${s.color}"></span>${s.name}</div>`
  ).join("")}</div>` : "";

  const html = `<div class="chart-wrap" id="${id}-wrap">
    <svg id="${id}-svg" viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      <defs>${gradDefs}</defs>
      ${gridLines}
      <line x1="${margin.left}" x2="${margin.left + w}" y1="${y(0)}" y2="${y(0)}" stroke="#D5D9E0" stroke-width="1"/>
      ${bars}${catLabels}
    </svg>
    <div class="chart-tooltip" id="${id}-tooltip"></div>
  </div>${legend}`;

  afterRender(() => {
    const svg = document.getElementById(id + "-svg");
    const tooltip = document.getElementById(id + "-tooltip");
    const visible = series.map(() => true);

    series.forEach((s, si) => {
      const legendItem = document.getElementById(id + "-legend-" + si);
      if (legendItem) {
        legendItem.addEventListener("click", () => {
          visible[si] = !visible[si];
          legendItem.classList.toggle("off", !visible[si]);
          const g = document.getElementById(id + "-series-" + si);
          if (g) g.style.display = visible[si] ? "" : "none";
        });
      }
      categories.forEach((cat, ci) => {
        const rect = document.getElementById(id + "-bar-" + si + "-" + ci);
        if (!rect) return;
        rect.addEventListener("mousemove", (e) => {
          const svgRect = svg.getBoundingClientRect();
          const pxX = e.clientX - svgRect.left, pxY = e.clientY - svgRect.top;
          tooltip.innerHTML = `<div class="tt-title">${cat}</div>${tooltipRow(s.color, s.name, yFormat(s.values[ci]))}`;
          tooltip.classList.add("show");
          let left = pxX + 14;
          if (left > svgRect.width - 170) left = pxX - 175;
          tooltip.style.left = left + "px";
          tooltip.style.top = Math.max(0, pxY - 44) + "px";
          rect.setAttribute("opacity", "0.82");
        });
        rect.addEventListener("mouseleave", () => {
          tooltip.classList.remove("show");
          rect.setAttribute("opacity", "1");
        });
      });
    });
  });

  return html;
}

// ============== Interactive correlation heatmap ==============
function heatmap(matrix, labels) {
  const id = nextId("hm");
  const cell = 60;
  const margin = { top: 8, left: 46 };
  const size = labels.length;
  const width = margin.left + cell * size + 10;
  const height = margin.top + cell * size + 30;

  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mixColor(c1, c2, t) {
    const p1 = hexToRgb(c1), p2 = hexToRgb(c2);
    return `rgb(${Math.round(p1[0] + (p2[0] - p1[0]) * t)},${Math.round(p1[1] + (p2[1] - p1[1]) * t)},${Math.round(p1[2] + (p2[2] - p1[2]) * t)})`;
  }
  function colorFor(v) { return v >= 0 ? mixColor("#F0F2F7", "#E8A200", v) : mixColor("#F0F2F7", "#E1584C", -v); }

  let cells = "", rowLabelSvg = "", colLabelSvg = "";
  labels.forEach((rowLabel, ri) => {
    rowLabelSvg += `<text id="${id}-rl-${ri}" x="${margin.left - 8}" y="${margin.top + ri * cell + cell / 2 + 4}" text-anchor="end" class="tooltip-svg-label">${rowLabel}</text>`;
    labels.forEach((colLabel, ci) => {
      const v = matrix[rowLabel][colLabel];
      const cx = margin.left + ci * cell, cy = margin.top + ri * cell;
      const textColor = Math.abs(v) > 0.55 ? "#151E2B" : "#151E2B";
      cells += `<rect id="${id}-c-${ri}-${ci}" class="hover-target" x="${cx}" y="${cy}" width="${cell - 3}" height="${cell - 3}" fill="${colorFor(v)}" rx="4"/>`;
      cells += `<text x="${cx + (cell - 3) / 2}" y="${cy + (cell - 3) / 2 + 4}" text-anchor="middle" font-size="12" fill="${textColor}" style="pointer-events:none">${v.toFixed(2)}</text>`;
    });
  });
  labels.forEach((colLabel, ci) => {
    colLabelSvg += `<text id="${id}-cl-${ci}" x="${margin.left + ci * cell + (cell - 3) / 2}" y="${margin.top + cell * size + 18}" text-anchor="middle" class="tooltip-svg-label">${colLabel}</text>`;
  });

  const html = `<div class="chart-wrap" id="${id}-wrap">
    <svg id="${id}-svg" viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${cells}${rowLabelSvg}${colLabelSvg}</svg>
    <div class="chart-tooltip" id="${id}-tooltip"></div>
  </div>`;

  afterRender(() => {
    const svg = document.getElementById(id + "-svg");
    const tooltip = document.getElementById(id + "-tooltip");
    labels.forEach((rowLabel, ri) => {
      labels.forEach((colLabel, ci) => {
        const rect = document.getElementById(id + "-c-" + ri + "-" + ci);
        if (!rect) return;
        rect.addEventListener("mousemove", (e) => {
          const svgRect = svg.getBoundingClientRect();
          const pxX = e.clientX - svgRect.left, pxY = e.clientY - svgRect.top;
          const v = matrix[rowLabel][colLabel];
          tooltip.innerHTML = `<div class="tt-title">${rowLabel} &harr; ${colLabel}</div>${tooltipRow(v >= 0 ? "#E8A200" : "#E1584C", "Correlation", v.toFixed(3))}`;
          tooltip.classList.add("show");
          let left = pxX + 14;
          if (left > svgRect.width - 170) left = pxX - 175;
          tooltip.style.left = left + "px"; tooltip.style.top = Math.max(0, pxY - 40) + "px";
          document.getElementById(id + "-rl-" + ri).setAttribute("font-weight", "700");
          document.getElementById(id + "-cl-" + ci).setAttribute("font-weight", "700");
          rect.setAttribute("stroke", "#151E2B"); rect.setAttribute("stroke-width", "1.5");
        });
        rect.addEventListener("mouseleave", () => {
          tooltip.classList.remove("show");
          document.getElementById(id + "-rl-" + ri).setAttribute("font-weight", "400");
          document.getElementById(id + "-cl-" + ci).setAttribute("font-weight", "400");
          rect.removeAttribute("stroke"); rect.removeAttribute("stroke-width");
        });
      });
    });
  });

  return html;
}

// ============== Interactive efficient frontier ==============
function frontierChart(opts) {
  const { width = 640, height = 400, frontier, points } = opts;
  const id = nextId("fc");
  const margin = { top: 20, right: 30, bottom: 46, left: 62 };
  const w = width - margin.left - margin.right;
  const h = height - margin.top - margin.bottom;

  const allX = frontier.map((f) => f.vol).concat(points.map((p) => p.vol));
  const allY = frontier.map((f) => f.ret).concat(points.map((p) => p.ret));
  const xMin = Math.min(...allX) * 0.9, xMax = Math.max(...allX) * 1.08;
  const yMin = Math.min(...allY) * 0.85, yMax = Math.max(...allY) * 1.1;

  const x = (v) => margin.left + scale(v, xMin, xMax, 0, w);
  const y = (v) => margin.top + scale(v, yMax, yMin, 0, h);

  const xTicks = niceTicks(xMin, xMax, 4), yTicks = niceTicks(yMin, yMax, 4);
  let grid = "";
  xTicks.forEach((t) => { grid += `<line x1="${x(t)}" x2="${x(t)}" y1="${margin.top}" y2="${margin.top + h}" stroke="#E8EAEF"/><text x="${x(t)}" y="${margin.top + h + 20}" text-anchor="middle" class="tooltip-svg-label">${(t * 100).toFixed(1)}%</text>`; });
  yTicks.forEach((t) => { grid += `<line x1="${margin.left}" x2="${margin.left + w}" y1="${y(t)}" y2="${y(t)}" stroke="#E8EAEF"/><text x="${margin.left - 8}" y="${y(t) + 4}" text-anchor="end" class="tooltip-svg-label">${(t * 100).toFixed(2)}%</text>`; });

  const frontierPath = frontier.map((f, i) => `${i === 0 ? "M" : "L"} ${x(f.vol).toFixed(1)} ${y(f.ret).toFixed(1)}`).join(" ");
  const markers = points.map((p, pi) =>
    `<circle id="${id}-pt-${pi}" class="hover-target" cx="${x(p.vol).toFixed(1)}" cy="${y(p.ret).toFixed(1)}" r="7" fill="${p.color}" stroke="#fff" stroke-width="2"/>` +
    `<text x="${x(p.vol) + 12}" y="${y(p.ret) + 4}" font-size="11.5" font-weight="600" fill="${p.color}" style="pointer-events:none">${p.name}</text>`
  ).join("");

  const html = `<div class="chart-wrap" id="${id}-wrap">
    <svg id="${id}-svg" viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      ${grid}
      <path d="${frontierPath}" fill="none" stroke="#1D8FA6" stroke-width="2"/>
      ${markers}
      <text x="${margin.left + w / 2}" y="${height - 6}" text-anchor="middle" class="tooltip-svg-label">Weekly volatility (risk) &#8594;</text>
    </svg>
    <div class="chart-tooltip" id="${id}-tooltip"></div>
  </div>`;

  afterRender(() => {
    const svg = document.getElementById(id + "-svg");
    const tooltip = document.getElementById(id + "-tooltip");
    points.forEach((p, pi) => {
      const el = document.getElementById(id + "-pt-" + pi);
      if (!el) return;
      el.addEventListener("mousemove", (e) => {
        const svgRect = svg.getBoundingClientRect();
        const pxX = e.clientX - svgRect.left, pxY = e.clientY - svgRect.top;
        tooltip.innerHTML = `<div class="tt-title">${p.name}</div>` +
          tooltipRow(p.color, "Return", (p.ret * 100).toFixed(2) + "% / wk") +
          tooltipRow(p.color, "Volatility", (p.vol * 100).toFixed(2) + "% / wk") +
          tooltipRow(p.color, "Sharpe", p.sharpe.toFixed(3));
        tooltip.classList.add("show");
        let left = pxX + 16;
        if (left > svgRect.width - 170) left = pxX - 175;
        tooltip.style.left = left + "px"; tooltip.style.top = Math.max(0, pxY - 50) + "px";
        el.setAttribute("r", "9.5");
      });
      el.addEventListener("mouseleave", () => { tooltip.classList.remove("show"); el.setAttribute("r", "7"); });
    });
  });

  return html;
}

function heroSparkline() {

      <tr class="hover-row" data-jump="risk"><td>Risk Forecasting</td><td style="text-align:left">GARCH systematically over-forecasts volatility vs. the calmer 2024 test period</td></tr>

      <tr class="hover-row" data-jump="portfolio"><td>Portfolio Optimization</td><td style="text-align:left">Max-Sharpe concentrates 100% in MSFT + XOM based on training-period estimates</td></tr>
      <tr class="highlight hover-row" data-jump="backtest"><td>Backtest</td><td style="text-align:left">Equal-Weight beats both optimized portfolios out-of-sample on every metric</td></tr>
    </table>
  `;
}

// ================= SECTION: Data & EDA =================
function renderEDA() {
  const priceSeries = TICKERS.map((t) => ({ name: t, color: PALETTE[t], values: DATA.priceSeries[t].map((d) => d.close) }));
  const dates = DATA.priceSeries.AMZN.map((d) => d.date.slice(0, 7));
  const retVolRows = DATA.edaSummary.slice().sort((a, b) => b.avgReturn - a.avgReturn)
    .map((r) => `<tr class="hover-row"><td>${r.ticker}</td><td>${fmtNum(r.avgReturn, 5)}</td><td>${fmtPct(r.avgVol, 2)}</td><td>${r.skew.toFixed(3)}</td><td>${r.kurt.toFixed(3)}</td></tr>`).join("");

  return `
    <div class="eyebrow">Stage 01 &middot; Steps 5&ndash;6</div>
    <h1>Data &amp; Exploratory Analysis</h1>
    <p class="dek">Daily price data (2020&ndash;2024) resampled to weekly frequency, cleaned, and feature-engineered before any modelling begins.</p>

    <div class="card">
      <h3>Weekly closing price, all companies</h3>
      <div class="card-note">Hover the chart for exact prices by date. Click a ticker in the legend to hide/show it.</div>
      ${lineChart({ series: priceSeries, xLabels: dates, yFormat: (v) => "$" + v.toFixed(0) })}
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>Return correlation</h3>
        <div class="card-note">Hover any cell for the exact correlation. AMZN&ndash;MSFT most correlated (0.64); AMZN&ndash;XOM least (&minus;0.02).</div>
        ${heatmap(DATA.correlation, TICKERS)}
      </div>
      <div class="card">
        <h3>Return &amp; risk profile</h3>
        <div class="card-note">Positive excess kurtosis everywhere &rarr; fat tails &rarr; motivates GARCH (Stage 03)</div>
        <table>
          <tr><th style="text-align:left">Ticker</th><th>Avg wk. return</th><th>Ann. vol.</th><th>Skew</th><th>Kurtosis</th></tr>
          ${retVolRows}
        </table>
      </div>
    </div>
  `;
}

// ================= SECTION: Return Prediction =================
function renderReturnPrediction() {
  const models = ["Naive (zero)", "Naive (persist)", "Linear Reg", "Ridge", "Lasso"];
  const colors = { "Naive (zero)": "#9AA3B2", "Naive (persist)": "#647085", "Linear Reg": "#E8A200", Ridge: "#1D8FA6", Lasso: "#8B5FBF" };
  const series = models.map((m) => ({ name: m, color: colors[m], values: TICKERS.map((t) => DATA.modelComparison[t][m].rmse) }));
  const bestPerTicker = Object.fromEntries(TICKERS.map((t) => [t, models.reduce((a, b) => (DATA.modelComparison[t][b].rmse < DATA.modelComparison[t][a].rmse ? b : a))]));
  const rows = TICKERS.map((t) => {
    const m = DATA.modelComparison[t];
    return `<tr class="best hover-row"><td>${t}</td>` + models.map((mo) => `<td ${mo === bestPerTicker[t] ? 'style="color:#B87E00;font-weight:700;"' : ""}>${m[mo].rmse.toFixed(4)}</td>`).join("") + `</tr>`;
  }).join("");

  return `
    <div class="eyebrow">Stage 02 &middot; Steps 7 &amp; 8</div>
    <h1>Return Prediction</h1>
    <p class="dek">Linear Regression, Ridge, and Lasso, evaluated on a 50-week out-of-sample test set against two naive baselines. Lower RMSE is better. Hover any bar for the exact value; click a legend item to isolate that model.</p>
    <div class="card">
      <h3>Test-set RMSE by model and company</h3>
      <div class="card-note">Lasso has the lowest RMSE for AMZN, JPM, KO and XOM, Linear Regression for MSFT, and the naive baseline for JNJ &ndash; but margins are tiny. With standardised inputs, Lasso removed every feature for five stocks (three kept for JPM), so its forecast is essentially the average return: the gain reflects caution, not newly found signal.</div>
      ${barChart({ series, categories: TICKERS, yFormat: (v) => v.toFixed(2) })}
    </div>
    <div class="card">
      <h3>Full RMSE table</h3>
      <table>
        <tr><th style="text-align:left">Ticker</th>${models.map((m) => `<th>${m}</th>`).join("")}</tr>
        ${rows}
      </table>
      <div class="footnote">Gold highlight = lowest (best) RMSE for that company. R&sup2; was at or below zero for every model/company pair except Linear Regression on MSFT (R&sup2; = 0.001), so no model explains meaningful test-set variance. Ridge and Lasso inputs are standardised (training data only); the penalty was tuned by time-series cross-validation.</div>
    </div>
  `;
}

// ================= SECTION: Risk Forecasting (GARCH) =================
function renderRiskForecasting() {
  const gRows = DATA.garchParams.map((g) => `<tr class="hover-row"><td>${g.ticker}</td><td>${g.omega.toFixed(4)}</td><td>${g.alpha.toFixed(4)}</td><td>${g.beta.toFixed(4)}</td><td>${g.persistence.toFixed(3)}</td></tr>`).join("");
  const volSeries = [
    { name: "Forecast volatility", color: "#E1584C", values: DATA.garchVolEval.map((g) => g.forecast) },
    { name: "Realized volatility", color: "#1D8FA6", values: DATA.garchVolEval.map((g) => g.realized) },
  ];
  return `
    <div class="eyebrow">Stage 03 &middot; Step 7 (Branch B) &amp; Step 8</div>
    <h1>Risk Forecasting &ndash; GARCH(1,1)</h1>
    <p class="dek">A GARCH(1,1) model fitted per company, justified directly by the fat tails found in Stage 01. Volatility persistence (&alpha;+&beta;) is high across the board.</p>
    <div class="card">
      <h3>Fitted GARCH(1,1) parameters</h3>
      <table>
        <tr><th style="text-align:left">Ticker</th><th>&omega;</th><th>&alpha;</th><th>&beta;</th><th>Persistence</th></tr>
        ${gRows}
      </table>
      <div class="footnote">Persistence ranges from 0.93 (JPM) to 0.995 (XOM). JNJ and XOM show boundary solutions (&alpha; = 0), a known instability when fitting GARCH to a relatively short 197-week window.</div>
    </div>
    <div class="card">
      <h3>Forecast vs. realized volatility, test period</h3>
      <div class="card-note">GARCH forecasts exceed realized volatility for every company &ndash; hover for exact figures. Part of the gap is a measurement effect: realized volatility is proxied by the absolute weekly return, which understates true volatility by roughly 20%.</div>
      ${barChart({ series: volSeries, categories: TICKERS, yFormat: (v) => v.toFixed(2) })}
    </div>
  `;
}

// ================= SECTION: Monte Carlo =================
function renderMonteCarlo() {
  const r1 = (v) => (Math.round((v + 1e-9) * 10) / 10).toFixed(1); // round half up, matching the written report
  const rows = DATA.monteCarlo.map((m) => `<tr class="${m.highlight ? "highlight" : ""} hover-row"><td>${m.name}</td><td>${r1(m.var95)}%</td><td>${r1(m.cvar95)}%</td><td>${r1(m.var99)}%</td><td>${r1(m.cvar99)}%</td></tr>`).join("");
  const categories = DATA.monteCarlo.map((m) => (m.name === "Equal-Weight Portfolio" ? "Portfolio" : m.name));
  const series95 = [{ name: "95% VaR", color: "#E1584C", values: DATA.monteCarlo.map((m) => m.var95) }];
  const series99 = [{ name: "99% VaR", color: "#B83A2F", values: DATA.monteCarlo.map((m) => m.var99) }];

  const toggleId = nextId("mctoggle");
  const chart95 = barChart({ series: series95, categories, yFormat: (v) => v.toFixed(0) + "%", showLegend: false });
  const chart99 = barChart({ series: series99, categories, yFormat: (v) => v.toFixed(0) + "%", showLegend: false });

  afterRender(() => {
    const btn95 = document.getElementById(toggleId + "-95");
    const btn99 = document.getElementById(toggleId + "-99");
    const wrap95 = document.getElementById(toggleId + "-wrap95");
    const wrap99 = document.getElementById(toggleId + "-wrap99");
    btn95.addEventListener("click", () => { btn95.classList.add("active"); btn99.classList.remove("active"); wrap95.style.display = ""; wrap99.style.display = "none"; });
    btn99.addEventListener("click", () => { btn99.classList.add("active"); btn95.classList.remove("active"); wrap99.style.display = ""; wrap95.style.display = "none"; });
  });

  return `
    <div class="eyebrow">Stage 04 &middot; Step 7B</div>
    <h1>Monte Carlo Risk Simulation</h1>
    <p class="dek">10,000 simulated 50-week price paths per company, used to estimate Value-at-Risk and Conditional VaR &ndash; both per stock and for a correlation-aware equal-weight portfolio.</p>
    <div class="card">
      <h3>Value-at-Risk, single stocks vs. portfolio</h3>
      <div class="card-note">Toggle confidence level. VaR here is the loss over the 50-week horizon that is exceeded with only 5% (95% level) or 1% (99% level) probability. Diversification cuts portfolio VaR to roughly half of even the safest individual stock's VaR.</div>
      <div class="toggle-group">
        <button class="toggle-btn active" id="${toggleId}-95">95% confidence</button>
        <button class="toggle-btn" id="${toggleId}-99">99% confidence</button>
      </div>
      <div id="${toggleId}-wrap95">${chart95}</div>
      <div id="${toggleId}-wrap99" style="display:none">${chart99}</div>
    </div>
    <div class="card">
      <h3>Full VaR / CVaR table (50-week horizon)</h3>
      <table>
        <tr><th style="text-align:left"></th><th>95% VaR</th><th>95% CVaR</th><th>99% VaR</th><th>99% CVaR</th></tr>
        ${rows}
      </table>
    </div>
  `;
}

// ================= SECTION: Portfolio Optimization =================
function renderPortfolio() {
  const stratNames = ["Equal-Weight", "Min-Variance", "Max-Sharpe"];
  const series = stratNames.map((s) => ({ name: s, color: PORT_COLOR[s], values: DATA.portfolioWeights[s] }));
  const frontierPoints = DATA.portfolioMetrics.map((m) => ({ name: m.name, vol: m.weeklyVol, ret: m.weeklyRet, sharpe: m.sharpe, color: PORT_COLOR[m.name] }));
  const metricRows = DATA.portfolioMetrics.map((m) => `<tr class="hover-row"><td>${m.name}</td><td>${fmtPct(m.annualRet, 1)}</td><td>${fmtPct(m.annualVol, 1)}</td><td>${m.sharpe.toFixed(3)}</td></tr>`).join("");

  return `
    <div class="eyebrow">Stage 05 &middot; Step 9</div>
    <h1>Portfolio Optimization</h1>
    <p class="dek">Long-only mean-variance optimization. Expected returns use historical training-period averages; risk uses GARCH-forecast volatility combined with the training-period correlation matrix. Hover the frontier markers or bars for exact figures.</p>
    <div class="grid-2">
      <div class="card">
        <h3>Efficient frontier</h3>
        <div class="card-note">Min-Variance and Max-Sharpe sit exactly on the frontier; Equal-Weight sits inside it.</div>
        ${frontierChart({ frontier: DATA.efficientFrontier, points: frontierPoints })}
      </div>
      <div class="card">
        <h3>Portfolio weights by strategy</h3>
        ${barChart({ series, categories: TICKERS, yFormat: (v) => (v * 100).toFixed(0) + "%" })}
      </div>
    </div>
    <div class="card">
      <h3>Expected performance (training-period estimates)</h3>
      <table>
        <tr><th style="text-align:left">Portfolio</th><th>Ann. return</th><th>Ann. volatility</th><th>Sharpe</th></tr>
        ${metricRows}
      </table>
      <div class="footnote">These are the optimizer's <i>expectations</i>, based only on training data. Stage 06 tests them against what actually happened.</div>
    </div>
  `;
}

// ================= SECTION: Backtest =================
function renderBacktest() {
  const stratNames = ["Equal-Weight", "Min-Variance", "Max-Sharpe"];
  const cumSeries = stratNames.map((s) => ({ name: s, color: PORT_COLOR[s], values: DATA.backtestCumulative[s] }));
  const ddSeries = stratNames.map((s) => ({ name: s, color: PORT_COLOR[s], values: DATA.backtestDrawdown[s] }));
  const dates = DATA.backtestDates.map((d) => d.slice(0, 7));
  const metricRows = DATA.backtestMetrics.map((m) => {
    const isWinner = m.name === "Equal-Weight";
    return `<tr class="${isWinner ? "highlight" : ""} hover-row"><td>${m.name}</td><td>${fmtPct(m.totalRet, 1)}</td><td>${fmtPct(m.annualRet, 1)}</td><td>${fmtPct(m.annualVol, 1)}</td><td>${m.sharpe.toFixed(2)}</td><td>${fmtPct(m.maxDd, 1)}</td></tr>`;
  }).join("");

  return `
    <div class="eyebrow">Stage 06 &middot; Step 10</div>
    <h1>Out-of-Sample Backtest</h1>
    <p class="dek">Fixed portfolio weights from Stage 05, applied to the 50-week test period's <i>realized</i> returns. Hover either chart to trace exact weekly values.</p>
    <div class="card">
      <h3>Growth of $1 invested</h3>
      ${lineChart({ series: cumSeries, xLabels: dates, yFormat: (v) => "$" + v.toFixed(2), areaFor: "Equal-Weight" })}
    </div>
    <div class="grid-2">
      <div class="card">
        <h3>Drawdown from peak</h3>
        ${lineChart({ series: ddSeries, xLabels: dates, yFormat: (v) => v.toFixed(0) + "%" })}
      </div>
      <div class="card">
        <h3>Performance summary</h3>
        <table>
          <tr><th style="text-align:left">Portfolio</th><th>Total</th><th>Annual.</th><th>Vol.</th><th>Sharpe</th><th>Max DD</th></tr>
          ${metricRows}
        </table>
        <div class="footnote">Equal-Weight wins on every measure &ndash; the &ldquo;1/N puzzle&rdquo; (DeMiguel, Garlappi &amp; Uppal, 2009).</div>
      </div>
    </div>
  `;
}

// ================= App shell =================
const ICONS = {
  overview: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>`,
  eda: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16l4-6 3 4 5-8"/></svg>`,
  returns: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>`,
  risk: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c2-1 3-4 4-4s2 5 4 5 2-8 4-8 2 6 3 6 2-2 3-2"/></svg>`,
  montecarlo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/></svg>`,
  portfolio: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10l7 7"/><path d="M12 12A10 10 0 1 1 5 3.5"/></svg>`,
  backtest: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>`,
};
const SECTIONS = [
  { id: "overview", num: "00", label: "Overview", render: renderOverview },
  { id: "eda", num: "01", label: "Data & EDA", render: renderEDA },
  { id: "returns", num: "02", label: "Return Prediction", render: renderReturnPrediction },
  { id: "risk", num: "03", label: "Risk Forecasting", render: renderRiskForecasting },
  { id: "montecarlo", num: "04", label: "Monte Carlo", render: renderMonteCarlo },
  { id: "portfolio", num: "05", label: "Portfolio Optimization", render: renderPortfolio },
  { id: "backtest", num: "06", label: "Backtest", render: renderBacktest },
];

let CURRENT_INDEX = 0;
let SUPPRESS_OBSERVER = false;

function crumbBarHtml(s) {
  return `<div class="crumb-bar"><span class="crumb-icon">${ICONS[s.id]}</span>Stage ${s.num} <b>${s.label}</b></div>`;
}

function initApp() {
  const nav = document.getElementById("nav");
  const main = document.getElementById("main");

  SECTIONS.forEach((s, i) => {
    const navItem = document.createElement("div");
    navItem.className = "nav-item" + (i === 0 ? " active" : "");
    navItem.dataset.id = s.id;
    navItem.innerHTML = `<span class="nav-icon">${ICONS[s.id]}</span><span class="nav-num">${s.num}</span><span class="nav-label">${s.label}</span>`;
    navItem.addEventListener("click", () => scrollToSection(s.id));
    nav.appendChild(navItem);

    const sectionDiv = document.createElement("div");
    sectionDiv.className = "section";
    sectionDiv.id = "section-" + s.id;
    sectionDiv.innerHTML = crumbBarHtml(s) + s.render();
    main.appendChild(sectionDiv);
    runPendingInits();
  });

  initScrollSpy();

  document.querySelectorAll("tr[data-jump]").forEach((row) => {
    row.style.cursor = "pointer";
    row.addEventListener("click", () => scrollToSection(row.dataset.jump));
  });
}

function scrollToSection(id) {
  const el = document.getElementById("section-" + id);
  if (!el) return;
  SUPPRESS_OBSERVER = true;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  setActiveIndex(SECTIONS.findIndex((s) => s.id === id));
  window.clearTimeout(scrollToSection._t);
  scrollToSection._t = window.setTimeout(() => { SUPPRESS_OBSERVER = false; }, 700);
}

function goNext() { if (CURRENT_INDEX < SECTIONS.length - 1) scrollToSection(SECTIONS[CURRENT_INDEX + 1].id); }
function goPrev() { if (CURRENT_INDEX > 0) scrollToSection(SECTIONS[CURRENT_INDEX - 1].id); }

function initScrollSpy() {
  const observer = new IntersectionObserver(
    (entries) => {
      if (SUPPRESS_OBSERVER) return;
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const id = entry.target.id.replace("section-", "");
          setActiveIndex(SECTIONS.findIndex((s) => s.id === id));
        }
      });
    },
    { root: null, rootMargin: "-15% 0px -70% 0px", threshold: 0 }
  );
  document.querySelectorAll(".section").forEach((el) => observer.observe(el));
}

function setActiveIndex(idx) {
  if (idx < 0) return;
  CURRENT_INDEX = idx;
  const id = SECTIONS[idx].id;
  document.querySelectorAll(".nav-item").forEach((el) => el.classList.toggle("active", el.dataset.id === id));
  updatePresenterNav();
}

function initPresenterNav() {
  const dotsWrap = document.getElementById("pnav-dots");
  SECTIONS.forEach((s, i) => {
    const dot = document.createElement("button");
    dot.className = "pnav-dot" + (i === 0 ? " active" : "");
    dot.dataset.id = s.id;
    dot.title = s.label;
    dot.addEventListener("click", () => scrollToSection(s.id));
    dotsWrap.appendChild(dot);
  });
  document.getElementById("pnav-prev").addEventListener("click", goPrev);
  document.getElementById("pnav-next").addEventListener("click", goNext);

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goNext(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goPrev(); }
  });

  updatePresenterNav();
}

function updatePresenterNav() {
  document.querySelectorAll(".pnav-dot").forEach((el, i) => el.classList.toggle("active", i === CURRENT_INDEX));
  document.getElementById("pnav-prev").disabled = CURRENT_INDEX === 0;
  document.getElementById("pnav-next").disabled = CURRENT_INDEX === SECTIONS.length - 1;
  const label = document.getElementById("pnav-label");
  if (label) label.textContent = `${CURRENT_INDEX + 1} / ${SECTIONS.length} \u00b7 ${SECTIONS[CURRENT_INDEX].label}`;
}

function initPresentButton() {
  const btn = document.getElementById("present-btn");
  const label = document.getElementById("present-btn-label");
  if (!btn) return;
  btn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
  document.addEventListener("fullscreenchange", () => {
    label.textContent = document.fullscreenElement ? "Exit full screen" : "Present full screen";
  });
}

document.addEventListener("DOMContentLoaded", () => { initApp(); initPresentButton(); initPresenterNav(); });

</script>
